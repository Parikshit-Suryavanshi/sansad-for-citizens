name: Daily Report Fetch

on:
  schedule:
    # Runs every day at 6:00 AM IST (00:30 UTC)
    - cron: '30 0 * * *'
  workflow_dispatch:
    # Allows you to trigger this manually from the GitHub Actions tab

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your repository so the runner has all your files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install npm dependencies (axios, @google/generative-ai, dotenv)
      - name: Install dependencies
        run: npm install

      # Step 4: Run your fetch script
      # The GEMINI_API_KEY comes from GitHub Secrets (never hardcoded)
      - name: Fetch and process new reports
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node fetch-reports.js

      # Step 5: Rebuild the homepage index
      - name: Build index page
        run: node build-index.js

      # Step 6: Commit and push any new files back to the repo
      # If no new reports were processed, this step does nothing (no empty commits)
      - name: Commit and push new reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/ processed.json
          git diff --staged --quiet || git commit -m "chore: add new reports [$(date +'%Y-%m-%d')]"
          git push